name: Build Rafiq Muslim APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "رقم النسخة مثل 1.3"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Update version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          CURRENT_CODE=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle | head -1)
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i -E "s/versionCode [0-9]+/versionCode $NEW_CODE/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME\"/" app/build.gradle
          echo "New versionCode: $NEW_CODE"
          echo "New versionName: $VERSION_NAME"

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "Bump version to ${{ inputs.version_name }}"
          git push

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/rafiq-muslim-release.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: rafiq-muslim-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: gradle assembleRelease --stacktrace

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          gh release create "v$VERSION_NAME" app/build/outputs/apk/release/app-release.apk --title "Rafiq Muslim $VERSION_NAME" --notes "إصدار جديد من تطبيق رفيق المسلم."

      - name: Update update.json
        uses: actions/checkout@v4
        with:
          repository: RafiqMuslim-Updates/RafiqMuslim-Updates
          token: ${{ secrets.UPDATE_REPO_TOKEN }}
          path: update-repo

      - name: Write update manifest
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          VERSION_CODE=$(awk "/versionCode/{print $2; exit}" app/build.gradle)
          cat > update-repo/update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/RafiqMuslim-Updates/RafiqMuslim/releases/download/v$VERSION_NAME/app-release.apk",
            "message": "يتوفر إصدار جديد من تطبيق رفيق المسلم. قم بالتحديث للحصول على أحدث المميزات والتحسينات."
          }
          EOF
          cd update-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update manifest to $VERSION_NAME" || echo "No changes"
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RafiqMuslim-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
